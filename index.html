<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--bg4:#222;
  --green:#00e676;--green2:#00c853;--gd:rgba(0,230,118,.12);
  --red:#ff1744;--rd:rgba(255,23,68,.12);
  --blue:#2979ff;--bd:rgba(41,121,255,.12);
  --yellow:#ffd600;--yd:rgba(255,214,0,.12);
  --purple:#d500f9;--teal:#00bcd4;
  --text:#e8eaf6;--t2:#888;--t3:#444;
  --border:#2a2a2a;--border2:#333;
  --r:8px;--r2:12px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column}
.logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--green);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:16px}
.logo-text{font-size:14px;font-weight:700}
.logo-sub{font-size:10px;color:var(--green);font-weight:600;letter-spacing:.5px}
.mode-btns{display:flex;gap:6px;padding:10px}
.mode-btn{flex:1;padding:7px;border-radius:var(--r);border:1px solid var(--border2);background:none;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.mode-btn.active{background:var(--gd);color:var(--green);border-color:rgba(0,230,118,.3)}
nav{padding:8px;flex:1}
.nav-section{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:10px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--t2);font-size:13px;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--gd);color:var(--green);border:1px solid rgba(0,230,118,.15)}
.nav-icon{font-size:15px;width:20px;text-align:center}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:600;flex:1}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.8px;background:var(--gd);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.content{flex:1;overflow-y:auto;padding:20px}

/* FORMS */
select,input[type=text],input[type=date],input[type=number],input[type=time],textarea{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:inherit;outline:none;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
input[type=color]{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);height:38px;padding:3px 6px;cursor:pointer;width:60px}
textarea{resize:vertical;min-height:80px}
label{font-size:12px;color:var(--t2);font-weight:500;display:block;margin-bottom:5px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--green);color:#000}.btn-primary:hover{background:var(--green2)}
.btn-danger{background:var(--rd);color:var(--red);border:1px solid rgba(255,23,68,.3)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{border-color:var(--t2)}
.btn-sm{padding:4px 10px;font-size:12px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.card h3{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:800;line-height:1}
.kpi-sub{font-size:11px;color:var(--t2);margin-top:4px}
.kpi.g{border-color:rgba(0,230,118,.3)}.kpi.g .kpi-value{color:var(--green)}
.kpi.r{border-color:rgba(255,23,68,.3)}.kpi.r .kpi-value{color:var(--red)}
.kpi.b{border-color:rgba(41,121,255,.3)}.kpi.b .kpi-value{color:var(--blue)}
.kpi.y{border-color:rgba(255,214,0,.3)}.kpi.y .kpi-value{color:var(--yellow)}
.kpi.p{border-color:rgba(213,0,249,.3)}.kpi.p .kpi-value{color:var(--purple)}
.kpi.t{border-color:rgba(0,188,212,.3)}.kpi.t .kpi-value{color:var(--teal)}

/* CHARTS */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chart-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-wrap{position:relative;height:200px}
.chart-wrap-tall{position:relative;height:260px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg3);color:var(--t2);padding:8px 12px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
tbody tr{border-bottom:1px solid rgba(42,42,42,.5);transition:background .1s;cursor:pointer}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:9px 12px;vertical-align:middle}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tag-g{background:var(--gd);color:var(--green)}
.tag-r{background:var(--rd);color:var(--red)}
.tag-b{background:var(--bd);color:var(--blue)}
.tag-y{background:var(--yd);color:var(--yellow)}
.tag-gray{background:var(--bg4);color:var(--t2)}

/* FORM GRID */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:100%;max-width:800px;max-height:92vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--t2);cursor:pointer;font-size:24px;line-height:1;padding:0}
.modal-close:hover{color:var(--text)}
.hidden{display:none!important}

/* IMAGE UPLOAD */
.img-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;color:var(--t2);transition:all .15s;background:var(--bg3);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.img-zone:hover,.img-zone.active{border-color:var(--green);color:var(--text);background:var(--gd)}
.img-zone.has-img{padding:4px;border-style:solid;border-color:var(--border2)}
.img-zone img{width:100%;max-height:200px;object-fit:cover;border-radius:6px;display:block}
.img-zone .img-label{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.5px;backdrop-filter:blur(4px)}
.img-zone .img-del{position:absolute;top:6px;right:6px;background:rgba(255,23,68,.8);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.img-hint{font-size:11px;color:var(--green);font-weight:600}

/* ENTRY TYPE BUTTONS */
.entry-grid{display:flex;gap:8px;flex-wrap:wrap}
.entry-btn{padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.entry-btn:hover{border-color:var(--t2);color:var(--text)}
.entry-btn.sel{background:var(--bd);color:var(--blue);border-color:rgba(41,121,255,.4)}

/* STAR RATING */
.stars{display:flex;gap:4px}
.star{font-size:22px;cursor:pointer;opacity:.3;transition:opacity .1s;background:none;border:none;line-height:1}
.star.on{opacity:1}

/* EMOTION */
.emo-group{display:flex;gap:6px;flex-wrap:wrap}
.emo-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--t2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.emo-btn:hover{background:var(--bg3)}
.emo-btn.sel{background:var(--bd);color:var(--blue);border-color:rgba(41,121,255,.4)}

/* MISC */
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--t2)}
.divider{height:1px;background:var(--border);margin:16px 0}
.flex-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:16px}.mb{margin-bottom:16px}

/* REVIEW CARD */
.rv-entry{display:flex;gap:14px;margin-bottom:20px}
.rv-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:18px}
.rv-dot.g{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,.5)}
.rv-dot.r{background:var(--red)}
.rv-dot.n{background:var(--t3)}
.rv-body{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:border-color .15s}
.rv-body:hover{border-color:var(--border2)}
.rv-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rv-imgs{display:grid;gap:2px;background:var(--border)}
.rv-img{position:relative;height:220px;overflow:hidden;background:var(--bg3)}
.rv-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.rv-body:hover .rv-img img{transform:scale(1.02)}
.rv-img-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:11px;font-weight:700;padding:16px 10px 6px;letter-spacing:.5px}
.rv-notes{padding:14px 16px;background:rgba(0,0,0,.15)}
.rv-notes-title{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rv-notes-text{font-size:13px;color:var(--text);line-height:1.8;white-space:pre-wrap;word-break:break-word;font-family:Georgia,serif}
.rv-footer{padding:8px 16px;background:var(--bg3);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}

/* PATTERN CARDS */
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.pattern-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px;cursor:pointer;transition:all .15s}
.pattern-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.pattern-card.sel{border-color:var(--blue);background:var(--bd)}
.pattern-wr{font-size:28px;font-weight:800;line-height:1;margin:6px 0}
.pattern-wr.g{color:var(--green)}.pattern-wr.r{color:var(--red)}
.pattern-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin:6px 0}
.pattern-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.pattern-stats{font-size:11px;color:var(--t2);display:flex;gap:8px;flex-wrap:wrap}

/* PERIOD SELECTOR */
.period-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.period-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.period-btn:hover{background:var(--bg3)}
.period-btn.active{background:var(--gd);color:var(--green);border-color:rgba(0,230,118,.3)}

/* WEEK/MONTH PILLS */
.wm-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;flex-wrap:wrap}
.wm-pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0;min-width:80px}
.wm-pill:hover{background:var(--bg3)}
.wm-pill.active{background:var(--gd);border-color:rgba(0,230,118,.4);color:var(--green)}
.wm-pill.neg.active{background:var(--rd);border-color:rgba(255,23,68,.3);color:var(--red)}
.wm-key{font-size:11px;font-weight:700}
.wm-pnl{font-size:13px;font-weight:800}
.wm-wr{font-size:10px;opacity:.7}

/* SUMMARY GRID */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sum-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px;cursor:pointer}
.sum-card:hover{border-color:var(--border2)}
.sum-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(42,42,42,.3)}
.sum-row:last-child{border:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

@media(max-width:768px){
  .sidebar{width:56px}
  .logo-text,.logo-sub,.nav-section,.mode-btns{display:none}
  .nav-btn{justify-content:center;padding:10px}
  .chart-grid,.chart-grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-icon">T</div>
    <div><div class="logo-text">Trading Journal</div><div class="logo-sub" id="mode-label">● BACKTEST</div></div>
  </div>
  <div class="mode-btns">
    <button class="mode-btn active" id="btn-bt" onclick="setMode('backtest')">📊 BT</button>
    <button class="mode-btn" id="btn-real" onclick="setMode('real')">💹 Real</button>
  </div>
  <nav>
    <div class="nav-section">Principal</div>
    <button class="nav-btn active" data-page="dashboard" onclick="go('dashboard')"><span class="nav-icon">📊</span>Dashboard</button>
    <button class="nav-btn" data-page="trades" onclick="go('trades')"><span class="nav-icon">📋</span>Operaciones</button>
    <button class="nav-btn" data-page="new" onclick="go('new')"><span class="nav-icon">➕</span>Nueva Op.</button>
    <button class="nav-btn" data-page="review" onclick="go('review')"><span class="nav-icon">🧠</span>Revisión</button>
    <div class="nav-section">Análisis</div>
    <button class="nav-btn" data-page="weekly" onclick="go('weekly')"><span class="nav-icon">📅</span>Semanal</button>
    <button class="nav-btn" data-page="monthly" onclick="go('monthly')"><span class="nav-icon">🗓️</span>Mensual</button>
    <div class="nav-section">Config</div>
    <button class="nav-btn" data-page="strategies" onclick="go('strategies')"><span class="nav-icon">🎯</span>Estrategias</button>
    <button class="nav-btn" data-page="settings" onclick="go('settings')"><span class="nav-icon">⚙️</span>Ajustes</button>
  </nav>
</div>
<div class="main">
  <div class="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="badge" id="mode-badge">BACKTEST</div>
    <div class="filter-bar">
      <select id="f-strat" onchange="render()"><option value="">Todas las estrategias</option></select>
      <select id="f-period" onchange="render()">
        <option value="">Todo</option>
        <option value="today">Hoy</option>
        <option value="week">Esta semana</option>
        <option value="month">Este mes</option>
        <option value="year">Este año</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn btn-secondary btn-sm" onclick="exportJSON()">⬇ Backup</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('imp').click()">⬆ Importar</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>

<!-- MODAL TRADE -->
<div class="modal-bg hidden" id="modal-trade-bg">
<div class="modal" id="modal-trade">
  <div class="modal-header">
    <h2 id="modal-title">Nueva Operación</h2>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>
  <div id="modal-body"></div>
  <div class="flex-row mt">
    <button class="btn btn-primary" onclick="saveModal()">💾 Guardar</button>
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
  </div>
</div>
</div>

<!-- MODAL REVIEW -->
<div class="modal-bg hidden" id="modal-rv-bg">
<div class="modal" style="max-width:900px">
  <div class="modal-header">
    <h2 id="rv-title">Análisis</h2>
    <button class="modal-close" onclick="closeRv()">×</button>
  </div>
  <div id="rv-body"></div>
</div>
</div>

<!-- MODAL IMG FULL -->
<div class="modal-bg hidden" id="modal-img-bg" onclick="closeImg()">
<div style="position:relative" onclick="event.stopPropagation()">
  <button onclick="closeImg()" style="position:absolute;top:-12px;right:-12px;background:var(--bg2);border:1px solid var(--border2);border-radius:50%;width:32px;height:32px;color:var(--text);font-size:18px;cursor:pointer;z-index:1">×</button>
  <img id="img-full" style="max-width:90vw;max-height:88vh;border-radius:var(--r2);display:block">
  <div id="img-notes" style="max-width:800px;margin:10px auto 0;background:var(--bg3);border-radius:var(--r);padding:12px 16px;font-size:13px;line-height:1.7;font-family:Georgia,serif;white-space:pre-wrap"></div>
</div>
</div>

<script>
// ================================================================
// STATE
// ================================================================
let DB = {
  trades: [],       // backtest
  realTrades: [],   // real
  strategies: [],
  settings: { capital: 5000, risk: 560 }
};
let mode     = 'backtest';
let page     = 'dashboard';
let editId   = null;
let selWeek  = '';
let selMonth = '';
let rvFilter = { result:'', strategy:'', entry:'' };

// ================================================================
// INDEXEDDB — stores images separately (no localStorage limit)
// ================================================================
let idb = null;

function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('TradingJournalImages', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('images', { keyPath: 'id' });
    req.onsuccess = e => { idb = e.target.result; res(); };
    req.onerror   = () => res(); // continue even if IDB fails
  });
}
function saveImage(tradeId, slot, dataUrl) {
  if (!idb || !dataUrl) return;
  const tx = idb.transaction('images', 'readwrite');
  tx.objectStore('images').put({ id: tradeId + '_' + slot, data: dataUrl });
}
function getImage(tradeId, slot) {
  return new Promise(res => {
    if (!idb) { res(''); return; }
    const tx  = idb.transaction('images', 'readonly');
    const req = tx.objectStore('images').get(tradeId + '_' + slot);
    req.onsuccess = e => res(e.target.result ? e.target.result.data : '');
    req.onerror   = () => res('');
  });
}
function deleteImages(tradeId) {
  if (!idb) return;
  const tx = idb.transaction('images', 'readwrite');
  tx.objectStore('images').delete(tradeId + '_img1');
  tx.objectStore('images').delete(tradeId + '_img2');
}

// ================================================================
// STORAGE (text data only — no images)
// ================================================================
function loadDB() {
  try {
    const d = localStorage.getItem('tj2');
    if (d) DB = { ...DB, ...JSON.parse(d) };
  } catch(e) {}
}
function saveDB() {
  try { localStorage.setItem('tj2', JSON.stringify(DB)); }
  catch(e) { alert('⚠️ Almacenamiento lleno. Exporta un backup JSON.'); }
}

// ================================================================
// UTILS
// ================================================================
const uid    = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fUSD   = v => (v>=0?'+':'') + parseFloat(v).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2});
const fPct   = v => (v>=0?'+':'') + parseFloat(v).toFixed(2) + '%';
const fDate  = d => d ? new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fDateS = d => d ? new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) : '—';
const getWeek  = d => { const dt=new Date(d+'T12:00:00'),j=new Date(dt.getFullYear(),0,1); return Math.ceil(((dt-j)/86400000+j.getDay()+1)/7); };
const getMonth = d => d ? d.slice(0,7) : '';
const stratColor = id => { const s=DB.strategies.find(x=>x.id===id); return s?s.color:'#00e676'; };
const stratName  = id => { const s=DB.strategies.find(x=>x.id===id); return s?s.name:'—'; };
const trades     = () => mode==='backtest' ? DB.trades : DB.realTrades;
const esc        = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function dateRange(p) {
  const now=new Date(), today=now.toISOString().slice(0,10);
  if (!p) return null;
  if (p==='today') return {f:today,t:today};
  if (p==='week') { const d=new Date(now); d.setDate(now.getDate()-now.getDay()+1); return {f:d.toISOString().slice(0,10),t:today}; }
  if (p==='month') return {f:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`,t:today};
  if (p==='year')  return {f:`${now.getFullYear()}-01-01`,t:today};
  return null;
}

function filtered() {
  const s  = document.getElementById('f-strat')?.value  || '';
  const p  = document.getElementById('f-period')?.value || '';
  const rng = dateRange(p);
  return trades().filter(t => {
    if (s && t.strategyId !== s) return false;
    if (rng && (t.date < rng.f || t.date > rng.t)) return false;
    return true;
  }).sort((a,b) => a.date > b.date ? -1 : 1);
}

function metrics(ts) {
  const ex   = ts.filter(t => t.resultado !== 'Sin Entrada');
  const wins = ex.filter(t => t.resultado === 'Positivo');
  const loss = ex.filter(t => t.resultado === 'Negativo');
  const total= ex.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const wr   = ex.length ? wins.length/ex.length*100 : 0;
  const gp   = wins.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const gl   = Math.abs(loss.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0));
  const pf   = gl>0 ? gp/gl : gp>0 ? 999 : 0;
  const avgW = wins.length ? gp/wins.length : 0;
  const avgL = loss.length ? gl/loss.length : 0;
  const exp  = (wins.length&&loss.length) ? (wr/100*avgW)-((1-wr/100)*avgL) : 0;
  let peak=DB.settings.capital,eq=DB.settings.capital,dd=0;
  [...ex].sort((a,b)=>a.date>b.date?1:-1).forEach(t=>{
    eq+=parseFloat(t.pnl)||0;
    if(eq>peak)peak=eq;
    const d=peak>0?(peak-eq)/peak*100:0;
    if(d>dd)dd=d;
  });
  const rr = avgL>0 ? avgW/avgL : 0;
  return {total,wr,trades:ex.length,wins:wins.length,pf,dd,exp,gp,gl,avgW,avgL,rr};
}

function go(p) {

function render() {
  const c = document.getElementById('content');

  else if (page==='trades')       c.innerHTML=pageTrades();
  else if (page==='new')          c.innerHTML=pageNew();

  else if (page==='weekly')     { c.innerHTML=pageWeekly();     initWeekly(); }
  else if (page==='monthly')    { c.innerHTML=pageMonthly();    initMonthly(); }
  else if (page==='strategies')   c.innerHTML=pageStrategies();
  else if (page==='settings')     c.innerHTML=pageSettings();
}

const charts = {};
function dc(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
const BASE = {
  responsive:true, maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#e8eaf6',bodyColor:'#888',borderColor:'#333',borderWidth:1}},
  scales:{x:{grid:{color:'#222'},ticks:{color:'#888',font:{size:10},maxRotation:45}},y:{grid:{color:'#222'},ticks:{color:'#888',font:{size:11}}}}
};
function lineChart(id,labels,data,fill,stroke) {

  charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:[{data,backgroundColor:fill,borderColor:stroke,borderWidth:2,fill:true,tension:.3,pointRadius:2}]},options:{...BASE}});

function barChart(id,labels,data,colors) {

function doughnut(id,labels,data,colors) {
  dc(id); const ctx=document.getElementById(id); if(!ctx)return;
  charts[id]=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:true,position:'bottom',labels:{color:'#888',font:{size:11},padding:10,boxWidth:12}},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#e8eaf6',bodyColor:'#888'}}}});

function initCharts() {
  const ts=filtered(), sorted=[...ts].sort((a,b)=>a.date>b.date?1:-1);
  let eq=DB.settings.capital; const eL=[],eD=[];
  sorted.forEach(t=>{if(t.resultado!=='Sin Entrada'){eq+=parseFloat(t.pnl)||0;eL.push(fDateS(t.date));eD.push(+eq.toFixed(2));}});
  lineChart('ch-eq',eL,eD,'rgba(0,230,118,.1)','#00e676');
  const sm={}; DB.strategies.forEach(s=>{sm[s.id]={n:s.name,v:0,c:s.color};});
  ts.forEach(t=>{if(t.resultado!=='Sin Entrada'&&sm[t.strategyId])sm[t.strategyId].v+=parseFloat(t.pnl)||0;});
  const sk=Object.keys(sm);
  barChart('ch-st',sk.map(k=>sm[k].n),sk.map(k=>+sm[k].v.toFixed(2)),sk.map(k=>sm[k].v>=0?'#00e676':'#ff1744'));
  const dm={};
  sorted.forEach(t=>{if(t.resultado!=='Sin Entrada'){if(!dm[t.date])dm[t.date]=0;dm[t.date]+=parseFloat(t.pnl)||0;}});
  const dk=Object.keys(dm).sort();
  barChart('ch-dy',dk.map(d=>fDateS(d)),dk.map(k=>+dm[k].toFixed(2)),dk.map(k=>dm[k]>=0?'#00e676':'#ff1744'));
  doughnut('ch-di',['Positivo','Negativo','Sin Entrada'],
    [ts.filter(t=>t.resultado==='Positivo').length,ts.filter(t=>t.resultado==='Negativo').length,ts.filter(t=>t.resultado==='Sin Entrada').length],
    ['#00e676','#ff1744','#444']);
  const ses={'Asia':0,'London':0,'New York':0};
  ts.forEach(t=>{if(t.session&&ses[t.session]!==undefined)ses[t.session]++;});
  doughnut('ch-se',Object.keys(ses),Object.values(ses),['#2979ff','#ffd600','#e040fb']);
}

function calcPct() {
  const pnl=parseFloat(document.getElementById('n-pnl')?.value)||0;
  const cap=parseFloat(document.getElementById('n-cap')?.value)||DB.settings.capital||1;
  const el=document.getElementById('n-pct');
  if(el&&pnl!==0) el.value=(pnl/cap*100).toFixed(2);
}
function calcR() {
  const ep=parseFloat(document.getElementById('n-entry-price')?.value)||0;
  const sl=parseFloat(document.getElementById('n-sl')?.value)||0;
  const tp=parseFloat(document.getElementById('n-tp')?.value)||0;
  const el=document.getElementById('n-r');
  if(!el||!ep||!sl) return;
  const risk=Math.abs(ep-sl);
  if(risk===0) return;
  const rw=tp ? (Math.abs(tp-ep)/risk).toFixed(2) : '';
  el.value=rw ? `1:${rw}R` : '';
}
function setStar(v) {
  _star=v;

// Image loading — pure FileReader, same as original working version
let _activeZone = 0;
function loadImg(input, slot) {
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>setZoneImg(slot, e.target.result);
  r.readAsDataURL(f);
}
function dropImg(e, slot) {
  e.preventDefault();
  document.getElementById('zone'+slot).classList.remove('active');
  const f=e.dataTransfer.files[0]; if(!f||!f.type.startsWith('image/')) return;
  const r=new FileReader();
  r.onload=ev=>setZoneImg(slot, ev.target.result);
  r.readAsDataURL(f);
}
function setZoneImg(slot, src) {
  if(slot===1) _img1=src; else _img2=src;
  const z=document.getElementById('zone'+slot); if(!z) return;
  z.classList.add('has-img');
  z.innerHTML=`<div class="img-label">${slot===1?'ANTES':'DESPUÉS'}</div>
    <img src="${src}" onclick="event.stopPropagation();showImg('${src}','')">
    <button class="img-del" onclick="event.stopPropagation();clearZone(${slot})">×</button>`;
}
function clearZone(slot) {
  if(slot===1) _img1=''; else _img2='';
  const z=document.getElementById('zone'+slot); if(!z) return;
  z.classList.remove('has-img');
  const label=slot===1?'📸':'📊';
  const hint=slot===1?'setup/pre-entrada':'resultado/cierre';
  z.innerHTML=`<input type="file" id="file${slot}" accept="image/*" style="display:none" onchange="loadImg(this,${slot})">
    <span style="font-size:28px">${label}</span><span>Click para subir</span>
    <span class="img-hint">o haz click aquí y luego Ctrl+V para pegar</span>`;
  z.onclick=()=>document.getElementById('file'+slot).click();
}

// Ctrl+V paste — click zone first to activate, then Ctrl+V
let _pasteSlot=0;
document.addEventListener('click', e=>{
  const z1=document.getElementById('zone1'), z2=document.getElementById('zone2');
  if(z1&&z1.contains(e.target)) _pasteSlot=1;
  else if(z2&&z2.contains(e.target)) _pasteSlot=2;
});
document.addEventListener('paste', e=>{
  const items=e.clipboardData?.items||[];
  for(const item of items){
    if(!item.type.startsWith('image/')) continue;
    e.preventDefault();
    const f=item.getAsFile(); if(!f) continue;
    const slot=_pasteSlot||1;
    const r=new FileReader();
    r.onload=ev=>setZoneImg(slot, ev.target.result);
    r.readAsDataURL(f);
    // auto-advance
    _pasteSlot=slot===1?2:1;
    break;
  }
});

function saveTrade() {
  const date=document.getElementById('n-date')?.value;
  const stratId=document.getElementById('n-strat')?.value;
  if(!date||!stratId){alert('Fecha y estrategia requeridos');return;}
  const t = {
    id: uid(), date, strategyId:stratId,
    asset:       document.getElementById('n-asset').value,
    tf:          document.getElementById('n-tf').value,
    session:     document.getElementById('n-session').value,
    tendencia:   document.getElementById('n-tend').value,
    resultado:   document.getElementById('n-result').value,
    capital:     parseFloat(document.getElementById('n-cap').value)||DB.settings.capital,
    risk:        parseFloat(document.getElementById('n-risk').value)||DB.settings.risk,
    pnl:         parseFloat(document.getElementById('n-pnl').value)||0,
    pnlPct:      parseFloat(document.getElementById('n-pct').value)||0,
    entryPrice:  parseFloat(document.getElementById('n-entry-price').value)||0,
    sl:          parseFloat(document.getElementById('n-sl').value)||0,
    tp:          parseFloat(document.getElementById('n-tp').value)||0,
    rResult:     document.getElementById('n-r').value||'',
    commission:  mode==='real'?(parseFloat(document.getElementById('n-comm')?.value)||0):0,
    notes:       document.getElementById('n-notes').value,
    quality:     _star,
    emotion:     _emo,
    entryType:   _entry,
    week:        getWeek(date), month:getMonth(date), mode,
    hasImg1:     !!_img1, hasImg2: !!_img2
  };
  if(mode==='real') DB.realTrades.push(t); else DB.trades.push(t);
  saveDB();
  // Save images to IndexedDB (separate, no localStorage limits)
  if(_img1) saveImage(t.id,'img1',_img1);
  if(_img2) saveImage(t.id,'img2',_img2);
  _img1=''; _img2='';
  go('review');
}

  document.getElementById('modal-title').textContent=id?'Editar Operación':'Nueva Operación';
  document.getElementById('modal-body').innerHTML=modalForm(t);

  if(id&&(t.hasImg1||t.hasImg2)){

      if(t.hasImg2){const d=await getImage(id,'img2');if(d)setZoneImgM(2,d);}
    })();
  }
}

function saveModal() {
  const date=document.getElementById('m-date').value;

  if(!date||!stratId){alert('Fecha y estrategia requeridos');return;}
  const list=mode==='real'?DB.realTrades:DB.trades;
  const data={
    date, strategyId:stratId,
    asset:      document.getElementById('m-asset').value,
    tf:         document.getElementById('m-tf').value,
    session:    document.getElementById('m-session').value,
    tendencia:  document.getElementById('m-tend').value,

    capital:    parseFloat(document.getElementById('m-cap').value)||DB.settings.capital,
    risk:       parseFloat(document.getElementById('m-risk').value)||DB.settings.risk,

    notes:      document.getElementById('m-notes').value,

    mode,
    hasImg1: _mImg1 ? true : (editId?list.find(t=>t.id===editId)?.hasImg1||false:false),

// Load images for review cards after render
async function loadReviewImages() {
  const ts=trades().filter(t=>t.hasImg1||t.hasImg2);
  for(const t of ts){
    if(t.hasImg1){
      const el=document.querySelector(`.rv-img1-${t.id}`);
      if(el&&!el.dataset.loaded){
        el.dataset.loaded='1';
        const d=await getImage(t.id,'img1');
        if(d) el.innerHTML=`<img src="${d}" onclick="event.stopPropagation();showImg('${d}','${esc(t.notes||'')}')" loading="lazy"><div class="rv-img-label">ANTES · Setup</div>`;
        else el.innerHTML='';
      }
    }

let editStratId=null;
function openStratForm(id) {
  editStratId=id||null;
  const s=id?DB.strategies.find(x=>x.id===id):null;
  document.getElementById('strat-form').classList.remove('hidden');
  document.getElementById('sf-title').textContent=id?'Editar Estrategia':'Nueva Estrategia';
  document.getElementById('sf-name').value=s?s.name:'';
  document.getElementById('sf-color').value=s?s.color:['#00e676','#2979ff','#ffd600','#e040fb','#ff6d00'][DB.strategies.length%5];
  document.getElementById('sf-desc').value=s?s.desc||'':'';
  document.getElementById('sf-name').focus();
}
function saveStrat() {
  const name=document.getElementById('sf-name').value.trim();
  if(!name){alert('Nombre requerido');return;}
  const data={name,color:document.getElementById('sf-color').value,desc:document.getElementById('sf-desc').value};
  if(editStratId){const i=DB.strategies.findIndex(s=>s.id===editStratId);if(i>=0)DB.strategies[i]={...DB.strategies[i],...data};}
  else DB.strategies.push({id:uid(),...data});
  saveDB(); refreshFilters(); render();
}
function delStrat(id) {
  const has=DB.trades.some(t=>t.strategyId===id)||DB.realTrades.some(t=>t.strategyId===id);
  if(has&&!confirm('Esta estrategia tiene operaciones. ¿Eliminar igualmente?'))return;
  if(!has&&!confirm('¿Eliminar estrategia?'))return;
  DB.strategies=DB.strategies.filter(s=>s.id!==id);
  saveDB(); render();
}

function updateRiskPct(){
  const c=parseFloat(document.getElementById('s-cap')?.value)||0;
  const r=parseFloat(document.getElementById('s-risk')?.value)||0;
  const el=document.getElementById('s-rpct');
  if(el) el.textContent=c>0?(r/c*100).toFixed(2)+'%':'—';
}
function updateLev(){
  const lev=parseInt(document.getElementById('s-lev')?.value)||1;
  const mc=parseFloat(document.getElementById('s-margin')?.value)||0;
  const v=document.getElementById('lev-val'),c=document.getElementById('s-opcap');
  if(v) v.textContent=lev+'x';
  if(c) c.textContent=mc>0?'$'+Math.round(mc*lev).toLocaleString():'—';
}
function adjLev(d){
  const el=document.getElementById('s-lev'); if(!el) return;
  el.value=Math.max(1,(parseInt(el.value)||1)+d); updateLev();
}
function saveSettings(){
  DB.settings.capital     =parseFloat(document.getElementById('s-cap')?.value)||5000;
  DB.settings.risk        =parseFloat(document.getElementById('s-risk')?.value)||560;
  DB.settings.leverage    =parseInt(document.getElementById('s-lev')?.value)||1;
  DB.settings.margin      =parseFloat(document.getElementById('s-margin')?.value)||0;
  DB.settings.broker      =document.getElementById('s-broker')?.value||'';
  DB.settings.account     =document.getElementById('s-account')?.value||'';
  DB.settings.accountType =document.getElementById('s-type')?.value||'Demo';
  saveDB(); alert('✅ Guardado');
}
function clearAll(){
  if(!confirm('¿Borrar TODOS los datos? No se puede deshacer.'))return;
  DB={trades:[],realTrades:[],strategies:[],settings:{capital:5000,risk:560}};
  saveDB(); render();
}

function exportCSV(){
  const ts=filtered();
  const h='Modo,Fecha,Estrategia,Activo,TF,Sesión,Tendencia,Resultado,P&L USD,P&L %,R,Capital,Riesgo,Tipo Entrada,Calidad,Emoción,Notas';
  const rows=ts.map(t=>[mode,t.date,stratName(t.strategyId),t.asset||'',t.tf||'',t.session||'',t.tendencia||'',t.resultado,t.pnl||0,t.pnlPct||0,t.rResult||'',t.capital||'',t.risk||'',t.entryType||'',t.quality||'',t.emotion||'',`"${(t.notes||'').replace(/"/g,'""')}"`].join(','));
  dl('journal.csv','text/csv',[h,...rows].join('\n'));
}
function exportJSON(){dl('journal_backup.json','application/json',JSON.stringify(DB,null,2));}
function dl(name,type,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.trades&&d.strategies){
        DB={...DB,...d};
        if(!DB.realTrades)DB.realTrades=[];
        if(!DB.settings)DB.settings={capital:5000,risk:560};
        saveDB(); refreshFilters(); render();
        alert('✅ Datos importados');
      } else alert('❌ Formato inválido');
    }catch{alert('❌ Error al leer el archivo');}
  };
  r.readAsText(f); e.target.value='';
}
